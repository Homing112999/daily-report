<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日上報">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>每日上報清單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one column. Date + one status line, today's list, a short ledger, settings tucked away. */
:root{
  --bg:#0d1210; --card:#151c19; --ink:#e4ece7; --muted:#83948b; --line:#24302a;
  --accent:#5fc59a; --late:#ec8a72; --warn:#e2b45a;
  --body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:0 16px;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:28px}
h1{font-size:26px;font-weight:700;margin:0;line-height:1.25}
h2{font-size:13px;font-weight:500;color:var(--muted);margin:0;letter-spacing:.06em}
.status{margin:6px 0 0;font-size:15px;color:var(--muted)}
.status b{font-weight:500}
.ok{color:var(--accent)} .late{color:var(--late)} .warn{color:var(--warn)}
.card{background:var(--card);border-radius:16px;padding:6px 18px 18px;display:flex;flex-direction:column;gap:14px}
.list{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .txt{color:var(--muted);text-decoration:line-through}
.num{flex:none;width:22px;color:var(--muted);font-size:14px;text-align:center}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--bg);padding:0;transition:background .15s,border-color .15s}
.tick[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tick svg{width:14px;height:14px}
.x{flex:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px 6px;border-radius:6px;opacity:.45}
.x:hover,.x:focus-visible{opacity:1;color:var(--late)}
.add{display:flex;gap:8px;padding-top:12px}
input[type=text],input[type=time]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
input[type=text]{flex:1}
input::placeholder{color:var(--muted)}
input:focus-visible,button:focus-visible,summary:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-size:15px;font-weight:500;border-radius:10px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700;width:100%;padding:13px}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.link{font:inherit;font-size:14px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-align:left}
.progress{display:flex;align-items:center;gap:12px;padding-top:12px;font-size:14px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);font-size:15px;padding:12px 0 0}
.section{display:flex;flex-direction:column;gap:10px}
.summary{font-size:15px}
.summary span{color:var(--muted)}
details.day summary{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;list-style:none}
details.day summary::-webkit-details-marker{display:none}
details.day .d{flex:1}
details.day .n{color:var(--muted);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--accent)} .dot.late{background:var(--late)}
.day-tasks{list-style:none;margin:0;padding:8px 0 10px 20px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
.day-tasks li.ok{color:var(--ink)}
.day-tasks li.ok::before{content:"✓  ";color:var(--accent)}
.day-tasks li.no::before{content:"○  "}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
details.settings>summary{font-size:14px;color:var(--muted);cursor:pointer;list-style:none;padding:4px 0}
details.settings>summary::-webkit-details-marker{display:none}
details.settings>summary::before{content:"⚙︎  "}
.settings-body{display:flex;flex-direction:column;gap:14px;padding-top:14px;font-size:15px}
.settings-body .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin:0}
.notice{font-size:14px;color:var(--warn);border:1px solid var(--warn);padding:10px 12px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1 id="dateTitle">每日上報</h1>
    <p class="status" id="status"></p>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section class="card" id="today" aria-live="polite">
    <div class="empty">載入中…</div>
  </section>

  <section class="section" id="history"></section>

  <details class="settings">
    <summary>設定同備份</summary>
    <div class="settings-body">
      <div class="row">
        <label for="deadline">每日上報截止時間</label>
        <input type="time" id="deadline" value="09:30">
      </div>
      <div class="row">
        <button class="btn" id="exportBtn" type="button">匯出備份</button>
        <label class="btn" for="importFile" tabindex="0">匯入備份</label>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <span id="saveMsg" class="ok"></span>
      </div>
      <p class="note">記錄只存喺呢部裝置。換機或者清除瀏覽器資料之前，記得先匯出備份。</p>
    </div>
  </details>
</div>

<script>
(function(){
  const WD = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  const pad = n => String(n).padStart(2,"0");
  const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const hm = iso => { const d=new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); };
  const dur = m => m >= 60 ? Math.floor(m/60)+" 小時 "+(m%60 ? (m%60)+" 分" : "") : m+" 分鐘";
  const uid = () => Math.random().toString(36).slice(2,10);
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  function h(tag, attrs, ...kids){
    const el = document.createElement(tag);
    for (const k in (attrs||{})) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
    return el;
  }

  // ---------- state ----------
  const LK = "dr.data.v1";
  const S = { ready:false, settings:{deadline:"09:30"}, days:{}, draft:[] };
  try { const d = JSON.parse(localStorage.getItem("dr.draft")||"[]"); if (Array.isArray(d)) S.draft = d; } catch(e){}
  const saveDraft = () => { try { localStorage.setItem("dr.draft", JSON.stringify(S.draft)); } catch(e){} };
  const persist = () => { try { localStorage.setItem(LK, JSON.stringify({days:S.days, settings:S.settings})); } catch(e){ showNotice("儲存失敗：瀏覽器拒絕寫入資料。"); } };

  function showNotice(msg){ const n=document.getElementById("notice"); n.textContent=msg; n.hidden=!msg; }
  function flash(msg){ const m = document.getElementById("saveMsg"); m.textContent = msg; setTimeout(()=>m.textContent="", 2500); }
  function focusSel(sel){ requestAnimationFrame(()=>{ const el=document.querySelector(sel); if(el) el.focus(); }); }

  function deadlineFor(dateKey){
    const [y,m,d] = dateKey.split("-").map(Number);
    const [hh,mm] = (S.settings.deadline||"09:30").split(":").map(Number);
    return new Date(y, m-1, d, hh, mm, 0);
  }

  function init(){
    try {
      const raw = JSON.parse(localStorage.getItem(LK) || "null");
      if (raw) { S.days = raw.days || {}; S.settings = Object.assign(S.settings, raw.settings||{}); }
    } catch(e){ showNotice("呢個瀏覽器唔俾儲存資料（可能係私密瀏覽模式），關咗頁面記錄就會冇咗。"); }
    S.ready = true; render();
  }

  // ---------- backup ----------
  function exportBackup(){
    const blob = new Blob([JSON.stringify({app:"daily-report", version:1, exportedAt:new Date().toISOString(), days:S.days, settings:S.settings}, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "每日上報備份-" + keyOf(new Date()) + ".json";
    document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  function importBackup(file){
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || typeof data.days !== "object") throw new Error("bad");
        // merge: backup fills in days this device doesn't have; existing days kept
        S.days = Object.assign({}, data.days, S.days);
        if (data.settings) S.settings = Object.assign({}, S.settings, data.settings);
        persist(); showNotice(""); flash("已匯入 " + Object.keys(data.days).length + " 日記錄");
        render();
      } catch(e){ showNotice("呢個檔案唔係有效嘅備份檔，請揀返由「匯出備份」下載嘅 .json 檔。"); }
    };
    r.readAsText(file);
  }
  document.getElementById("exportBtn").addEventListener("click", exportBackup);
  document.querySelector('label[for="importFile"]').addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.getElementById("importFile").click(); } });
  document.getElementById("importFile").addEventListener("change", e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ""; });
  document.getElementById("deadline").addEventListener("change", e => {
    if (!e.target.value) return;
    S.settings = Object.assign({}, S.settings, {deadline: e.target.value});
    persist(); flash("已儲存"); render();
  });

  // ---------- actions ----------
  function addDraft(text){
    text = text.trim(); if (!text) return;
    document.getElementById("draftInput").value = "";
    S.draft.push({id:uid(), text}); saveDraft(); render(); focusSel("#draftInput");
  }
  function submitPlan(todayKey){
    if (!S.draft.length) return;
    const now = new Date();
    S.days[todayKey] = {
      date: todayKey, submittedAt: now.toISOString(), deadline: S.settings.deadline,
      onTime: now <= deadlineFor(todayKey),
      tasks: S.draft.map(t => ({id:t.id, text:t.text, done:false, doneAt:null, added:false})),
    };
    S.draft = []; saveDraft(); persist(); render();
  }
  function toggle(key, tid){
    const t = S.days[key].tasks.find(x => x.id === tid); if (!t) return;
    t.done = !t.done; t.doneAt = t.done ? new Date().toISOString() : null;
    persist(); render();
  }
  function addLater(key, text){
    text = text.trim(); if (!text) return;
    document.getElementById("laterInput").value = "";
    S.days[key].tasks.push({id:uid(), text, done:false, doneAt:null, added:true});
    persist(); render(); focusSel("#laterInput");
  }
  function removeTask(key, tid){
    S.days[key].tasks = S.days[key].tasks.filter(x => x.id !== tid);
    persist(); render();
  }

  function addRow(id, placeholder, label, onAdd){
    const input = h("input",{type:"text", id, placeholder, autocomplete:"off", enterkeyhint:"done",
      onkeydown:e=>{ if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); onAdd(input.value); } }});
    return h("div",{class:"add"}, input, h("button",{class:"btn", onclick:()=>onAdd(input.value)}, label));
  }

  // ---------- render ----------
  function render(){
    const now = new Date();
    const todayKey = keyOf(now);
    document.getElementById("dateTitle").textContent = (now.getMonth()+1) + "月" + now.getDate() + "日 " + WD[now.getDay()];
    const dl = document.getElementById("deadline");
    if (document.activeElement !== dl) dl.value = S.settings.deadline || "09:30";
    if (!S.ready) return;

    // keep half-typed text and focus across re-renders
    const keep = {};
    for (const id of ["draftInput","laterInput"]) { const el = document.getElementById(id); if (el) keep[id] = {v:el.value, f:document.activeElement===el}; }
    requestAnimationFrame(() => { for (const id in keep) { const el = document.getElementById(id); if (el && !el.value) { el.value = keep[id].v; if (keep[id].f) el.focus(); } } });

    const status = document.getElementById("status");
    const card = document.getElementById("today");
    const day = S.days[todayKey];
    card.replaceChildren();

    if (!day) {
      const mins = Math.round((deadlineFor(todayKey) - now)/60000);
      status.replaceChildren(mins > 0
        ? h("span",{class: mins <= 30 ? "warn" : null}, "未上報 · " + S.settings.deadline + " 截止，仲有 " + dur(mins))
        : h("span",{class:"late"}, "未上報 · 已過 " + S.settings.deadline + " 截止時間"));

      // carry over unfinished from the most recent earlier day
      const prevKey = Object.keys(S.days).filter(k => k < todayKey).sort().pop();
      const draftTexts = new Set(S.draft.map(t=>t.text));
      const carry = prevKey ? S.days[prevKey].tasks.filter(t => !t.done && !draftTexts.has(t.text)) : [];

      card.append(addRow("draftInput", "今日要做咩？", "加入", addDraft));
      if (carry.length) card.append(h("button",{class:"link", onclick:()=>{ carry.forEach(t=>S.draft.push({id:uid(), text:t.text})); saveDraft(); render(); }}, "＋ 帶入上次未完成嘅 " + carry.length + " 項"));
      if (S.draft.length) card.append(h("ol",{class:"list"}, S.draft.map((t,i) => h("li",{class:"task"},
        h("span",{class:"num"}, i+1),
        h("span",{class:"txt"}, t.text),
        h("button",{class:"x", "aria-label":"移除 "+t.text, onclick:()=>{ S.draft=S.draft.filter(x=>x.id!==t.id); saveDraft(); render(); }}, "×")))));
      card.append(h("button",{class:"btn primary", disabled: !S.draft.length, onclick:()=>submitPlan(todayKey)},
        S.draft.length ? "上報（" + S.draft.length + " 項）" : "加入工作之後就可以上報"));
    } else {
      const done = day.tasks.filter(t=>t.done).length, total = day.tasks.length;
      let when;
      if (day.onTime) when = h("b",{class:"ok"}, "準時");
      else { const m = Math.max(1, Math.round((new Date(day.submittedAt) - deadlineFor(todayKey))/60000)); when = h("b",{class:"late"}, "遲咗 " + dur(m)); }
      status.replaceChildren(hm(day.submittedAt) + " 已上報 · ", when);

      card.append(h("div",{class:"progress"},
        h("div",{class:"bar"}, h("i",{style:"width:"+(total? done/total*100:0)+"%"})),
        h("span",{class: total && done===total ? "ok" : null}, total && done===total ? "全部完成" : "完成 " + done + " / " + total)));
      if (total) card.append(h("ul",{class:"list"}, day.tasks.map(t => h("li",{class:"task"+(t.done?" done":"")},
        h("button",{class:"tick", role:"checkbox", "aria-checked": String(!!t.done), "aria-label": t.text, html: CHECK, onclick:()=>toggle(todayKey, t.id)}),
        h("span",{class:"txt"}, t.text),
        h("button",{class:"x", "aria-label":"刪除 "+t.text, onclick:()=>removeTask(todayKey, t.id)}, "×")))));
      card.append(addRow("laterInput", "臨時多咗一項？", "加入", v => addLater(todayKey, v)));
    }
    renderHistory(todayKey);
  }

  function renderHistory(todayKey){
    const box = document.getElementById("history");
    const past = Object.keys(S.days).filter(k => k !== todayKey).sort().reverse().slice(0, 30);
    if (!past.length) { box.replaceChildren(); return; }

    // streak of consecutive days reported on time, ending today (or yesterday if today not yet reported)
    let streak = 0; const c = new Date(); if (!S.days[todayKey]) c.setDate(c.getDate()-1);
    while (true) { const d = S.days[keyOf(c)]; if (d && d.onTime) { streak++; c.setDate(c.getDate()-1); } else break; }
    let tDone=0, tAll=0;
    for (let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); const r=S.days[keyOf(d)]; if (r) { tAll+=r.tasks.length; tDone+=r.tasks.filter(t=>t.done).length; } }

    box.replaceChildren(
      h("h2",null,"記錄"),
      h("div",{class:"summary"}, "連續準時 ", h("b",null, streak + " 日"), h("span",null,"  ·  "), "近 7 日完成 ", h("b",null, tAll ? Math.round(tDone/tAll*100) + "%" : "–")),
      h("div",null, past.map(k => {
        const r = S.days[k], dt = new Date(k+"T00:00:00");
        const done = r.tasks.filter(t=>t.done).length;
        return h("details",{class:"day"},
          h("summary",null,
            h("span",{class:"dot " + (r.onTime ? "ok" : "late"), title: r.onTime ? "準時" : "遲報"}),
            h("span",{class:"d"}, (dt.getMonth()+1) + "月" + dt.getDate() + "日 " + WD[dt.getDay()]),
            h("span",{class:"n"}, done + " / " + r.tasks.length)),
          h("ul",{class:"day-tasks"},
            h("li",null, hm(r.submittedAt) + " 上報" + (r.onTime ? "（準時）" : "（遲報）")),
            r.tasks.map(t => h("li",{class:t.done?"ok":"no"}, t.text))));
      })),
      h("div",{class:"legend"}, h("span",null, h("i",{class:"dot ok"}), "準時"), h("span",null, h("i",{class:"dot late"}), "遲報"))
    );
  }

  render();
  init();
  if (location.hash === "#report") focusSel("#draftInput");
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  setInterval(render, 30000); // refresh countdown and date rollover only; never writes
})();
</script>

</body>
</html>
